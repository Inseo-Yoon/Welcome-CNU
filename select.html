<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>캐릭터 선택 | CNUtour</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body class="select-page">
  <div class="select-container">
    <h2>캐릭터를 선택하세요</h2>

    <div class="character-list">
      <div class="char-card">
        <img src="images/char1.png" alt="캐릭터 학생">
        <p>학생</p>
      </div>
      <div class="char-card">
        <img src="images/char2.png" alt="캐릭터 펭귄">
        <p>펭귄</p>
      </div>
      <div class="char-card">
        <img src="images/char3.png" alt="캐릭터 여우">
        <p>여우</p>
      </div>
      <div class="char-card">
        <img src="images/char4.png" alt="캐릭터 유령">
        <p>유령</p>
      </div>
      <div class="char-card">
        <img src="images/char5.png" alt="캐릭터 강아지">
        <p>강아지</p>
      </div>
    </div>

    <a href="index.html" class="btn-go">선택 완료</a>
  </div>
<script src="js/main.js"></script>
</body>
</html>
